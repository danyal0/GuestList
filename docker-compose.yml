name: mkeplays

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mkeplays
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mkeplays']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mkeplays?schema=public
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      # Replace these in production — see apps/api/.env.example.
      JWT_ACCESS_SECRET: change-me-access-secret-32-chars-min
      JWT_REFRESH_SECRET: change-me-refresh-secret-32-chars-min
      COOKIE_SECURE: 'false'
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  pgdata:
  uploads:
